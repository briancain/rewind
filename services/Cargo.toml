[workspace]
resolver = "2"
members = [
    "shared",
    "identity",
    "video-catalog",
    "upload",
    "transcode",
    "streaming",
    "social",
    "search",
    "delete-cleanup",
    "canary",
]

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
aws-config = "1"
aws-smithy-types = "1"
aws-sdk-dynamodb = "1"
aws-sdk-ses = "1"
aws-sdk-s3 = "1"
aws-sdk-sqs = "1"
aws-sdk-mediaconvert = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-cloudfront = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
opensearch = { version = "2.4", default-features = false, features = ["rustls-tls", "aws-auth"] }
url = "2"
thiserror = "2"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }
tower = "0.5"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
